# 本地 Windows Docker Desktop 联调用（与 fpk 内的 compose 结构一致，零 build）
# 用法（在 D:/Desktop/developing/QQnc/tools 下）：
#   docker compose -f docker-compose.dev.yml up -d
#   游戏 http://localhost:8081   面板 http://localhost:8082
services:
  mysql:
    image: mariadb:10.6
    container_name: qqfarm-dev-mysql
    command: ["--character-set-server=gbk", "--collation-server=gbk_chinese_ci", "--sql-mode=", "--lower-case-table-names=1", "--max-allowed-packet=64M"]
    environment:
      MYSQL_ROOT_PASSWORD: qqfarm123
    volumes:
      - qqfarm-dev-mysql:/var/lib/mysql
      - ../fnos/app/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    image: webdevops/php-apache:5.6
    container_name: qqfarm-dev-web
    environment:
      WEB_DOCUMENT_ROOT: /var/www/html
      WEB_DOCUMENT_INDEX: index.php
    ports:
      - "8081:80"
    volumes:
      - ../fnos/app/site:/var/www/html:ro
      - ../fnos/app/site/data:/var/www/html/data
      - ../fnos/app/site/uc_server/data:/var/www/html/uc_server/data
      - ../fnos/app/site/source/plugin/qqfarm/core/data:/var/www/html/source/plugin/qqfarm/core/data
      - ../fnos/app/docker/web/qqfarm.ini:/usr/local/etc/php/conf.d/zz-qqfarm.ini:ro
      - ../fnos/app/docker/apache/qqfarm.conf:/etc/apache2/conf-enabled/zz-qqfarm.conf:ro
    depends_on:
      mysql:
        condition: service_healthy

  panel:
    image: python:3.12-slim
    container_name: qqfarm-dev-panel
    ports:
      - "8082:5001"
    environment:
      PANEL_API: http://web/panel_api.php
      PANEL_TOKEN: qqfarm-panel-2026
      PANEL_GAME_PORT: "8081"
      PANEL_SOCKET: /tmp/app.sock
    volumes:
      - ../fnos/app/docker/panel:/panel:ro
    command: ["python", "/panel/app.py"]
    depends_on:
      - web

volumes:
  qqfarm-dev-mysql:
