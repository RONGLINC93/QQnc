; 挂载为 /usr/local/etc/php/conf.d/zz-qqfarm.ini（文件名靠后，保证覆盖镜像自带设置）
; 站点为 Discuz X2，依赖已废弃的 mysql_* 扩展，用兼容层映射到 mysqli
auto_prepend_file = /var/www/html/config/mysql_compat.php

short_open_tag = On
error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
log_errors = On
memory_limit = 256M
post_max_size = 32M
upload_max_filesize = 32M
max_execution_time = 120
max_input_time = 120
date.timezone = Asia/Shanghai
expose_php = Off
